name: Samla AIS-data

# Obs: den här filen är skriven men ännu inte testad på GitHub.
on:
  schedule:
    - cron: "17 */6 * * *"   # var sjätte timme
  workflow_dispatch:          # gör det möjligt att starta manuellt

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # Sedda fartyg sparas i cachen och inte i repot, så att råa fartygslistor inte publiceras.
      - name: Hämta sparat fartygsläge
        uses: actions/cache@v4
        with:
          path: data/vessels.json
          key: vessels-${{ github.run_id }}
          restore-keys: vessels-

      - name: Samla AIS-data i 30 minuter
        env:
          AISSTREAM_API_KEY: ${{ secrets.AISSTREAM_API_KEY }}
        run: python collector.py --minutes 30

            # docs/history.json får en rad per körning. Den går inte att återskapa i efterhand.
      - name: Spara siffrorna och historiken i repot
        run: |
          git config user.name "ais-collector"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data.json
          if [ -f docs/history.json ]; then git add docs/history.json; fi
          git diff --staged --quiet || git commit -m "Uppdatera siffror från AIS"
          git pull --rebase
          git push
